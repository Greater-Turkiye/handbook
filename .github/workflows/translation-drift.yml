# Warns when a Turkish (canonical) page changed after its English mirror,
# and fails when an English page lacks its translation_of header, points to
# a missing Turkish page, or a Turkish page has no English mirror.
# See scripts/check_translation_drift.py and issue #5.
name: Translation drift

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: translation-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: Check translation drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository (full history for commit times)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run drift check
        run: python scripts/check_translation_drift.py
